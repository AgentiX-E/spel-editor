name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Format check
        run: pnpm format:check
      - name: Test with coverage
        run: pnpm test
      - name: Build
        run: pnpm build

  publish:
    name: Publish to npm
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm (OIDC)
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "⚠ ${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Publish summary
        if: always()
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "### 📦 npm Package Published" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${PKG_NAME}\` | ${PKG_VER} |" >> $GITHUB_STEP_SUMMARY

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VER_NUM="${VERSION#v}"
          # This version's section, up to the next one, with the `---` rules and the blank lines
          # at either end dropped so the rendered release starts on content.
          #
          # The start match is consumed, which is what makes the range correct: with the usual
          # `awk '/start/,/end/'` form the section's own heading satisfies both patterns, the range
          # collapses to that single line and the file comes out empty, which is how a release ends
          # up with generated notes and nobody notices. v1.2.1 shipped that way and had to be
          # corrected by hand; this step is what keeps the next one from repeating it.
          #
          # The `has_notes` flag is derived from the file rather than from a grep for the heading,
          # for the same reason: a grep would report the section present while the extraction
          # produced nothing.
          awk -v ver="${VER_NUM}" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside && $0 !~ /^---$/ { lines[++n] = $0 }
            END {
              first = 1
              while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              last = n
              while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VER_NUM}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.changelog.outputs.version }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: true
